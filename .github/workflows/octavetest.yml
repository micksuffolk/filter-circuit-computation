name: Github Action for Octave
on:
  push:
    paths:
      - '**.m'
  pull_request:
    paths:
      - '**.m'
jobs:
  octave_test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - run: |
        sudo apt-get update
        sudo apt-get install -y octave octave-control
    - run: octave --eval "c"
      working-directory: ./src/components/
    - run: octave --eval "l"
      working-directory: ./src/components/
    - run: octave --eval "ctpf"
      working-directory: ./src/ctpf/
    - run: octave --eval "lcl"
      working-directory: ./src/lcl/
    - run: octave --eval "series_lc"
      working-directory: ./src/series/
